<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="群島 ISLES"><style>
.t{font-family:'Noto Serif TC','Source Han Serif TC','Songti TC','PMingLiU',serif;fill:#e8edf2}
.m{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#a9b8c6;letter-spacing:.32em}
.d{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;fill:#7a8da1;letter-spacing:.24em}
.drift{animation:drift 48s ease-in-out infinite alternate}
.drift2{animation:drift 64s ease-in-out infinite alternate-reverse}
.tw{animation:tw 3.6s ease-in-out infinite}
.trail{stroke-dasharray:2 7;animation:march 6s linear infinite}
@keyframes drift{from{transform:translateX(-60px)}to{transform:translateX(60px)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes march{to{stroke-dashoffset:-90}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
