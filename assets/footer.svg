<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0e13"/><stop offset="1" stop-color="#121b25"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#f0d38a" stop-opacity=".55"/><stop offset="1" stop-color="#f0d38a" stop-opacity="0"/></radialGradient>
